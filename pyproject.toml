[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genimerge"
version = "0.1.0"
description = "Merge Geni.com GEDCOM exports on the Geni profile ID and reconcile the result against Wikidata"
readme = "README.md"
requires-python = ">=3.10"
# Deliberately stdlib-only: urllib covers the Wikidata SPARQL endpoint, and a
# zero-dependency package keeps CI and cold clones trivial. Add a dependency
# only when the stdlib genuinely cannot do the job.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# **`slow` marks the tests that merge or reparse the WHOLE corpus.** Nothing is
# skipped by default - a bare `pytest` still runs every one of them, and that is
# the run that counts before pushing. The marker exists so a fast lane can be
# selected explicitly with `-m "not slow"`.
#
# Why it was needed: `test_merge_real_exports.py` merges all 245 exports in one
# module-scoped fixture, and that single merge now exceeds **ten minutes** on its
# own. Its cost scales with the corpus, so it crossed the agent tooling's
# ten-minute command ceiling somewhere around 2026-08-16 and made the full suite
# unrunnable from a tool call - which in turn made the "never claim verified
# without having run it" rule satisfiable only on subsets. See
# `CLAUDE.md` section *Cost: this repo is private, so CI is manual-only*.
markers = [
    "slow: merges or reparses the whole corpus; minutes, not seconds",
]

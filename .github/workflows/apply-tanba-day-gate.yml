name: Apply Tanba day-batch composer gate

# One-shot on main: wire install_tanba_day_gate into build-garborg-day.py
# (drop Tanba lines entirely incl. comments; never comment them out), prefer
# import from tanba_batch_block, then self-delete.
on:
  push:
    paths:
      - ".github/workflows/apply-tanba-day-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-tanba-day-gate
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Wire gate (prefer import over inline)
        run: |
          set -euo pipefail
          python scripts/install_tanba_day_gate.py
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/build-garborg-day.py")
          text = path.read_text(encoding="utf-8")
          # Prefer shared module over duplicated inline function.
          if "def tanba_blocked_qids(" in text and "from tanba_batch_block import tanba_blocked_qids" not in text:
              import re
              text2, n = re.subn(
                  r"\ndef tanba_blocked_qids\(\):.*?^\n(?=def kluge_blocked_from_universe)",
                  "\n",
                  text,
                  count=1,
                  flags=re.S | re.M,
              )
              if n != 1:
                  raise SystemExit(f"could not strip inline tanba_blocked_qids (n={n})")
              anchor = "import qs_v1  # noqa: E402 -- the one module that knows what a CREATE block is\n"
              if anchor not in text2:
                  raise SystemExit("qs_v1 import anchor missing")
              imp = "from tanba_batch_block import tanba_blocked_qids  # noqa: E402 - day batch must never edit Tanba\n"
              text2 = text2.replace(anchor, anchor + imp, 1)
              path.write_text(text2, encoding="utf-8")
              print("replaced inline tanba_blocked_qids with import")
          elif "from tanba_batch_block import tanba_blocked_qids" in text:
              print("import already present")
          else:
              raise SystemExit("gate function/import missing after install")
          PY
          # Proof
          grep -n 'from tanba_batch_block import tanba_blocked_qids' scripts/build-garborg-day.py
          grep -n 'if "tanba" in line.lower():' scripts/build-garborg-day.py
          grep -n 'tanba_blocked_qids()' scripts/build-garborg-day.py | head
          grep -n 'single_word = {w for w in markers if' scripts/build-garborg-day.py
          python -c "import ast; ast.parse(open('scripts/build-garborg-day.py',encoding='utf-8').read()); print('syntax ok')"
          # Day file must stay Tanba-clean (no recompose here)
          if [ -f reports/wikidata-garborg-day.txt ]; then
            if grep -qi tanba reports/wikidata-garborg-day.txt; then
              echo "ERROR: tanba present in day file" >&2
              exit 1
            fi
            echo "day file tanba-clean"
          fi

      - name: Commit gate; remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-tanba-day-gate.yml
          git add scripts/build-garborg-day.py
          git add -u .github/workflows/apply-tanba-day-gate.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          Wire Tanba day-batch gate: drop Tanba lines entirely; never comment them out

          Apply install_tanba_day_gate to build-garborg-day.py via
          tanba_batch_block.tanba_blocked_qids: excluded includes Tanba QIDs;
          names_excluded drops ANY line with tanba/Tanba QIDs including annotation
          comments (no # CREATE/LAST walls). Given-NN usable() token fix included.
          EOF
          )"
          git push origin HEAD:main

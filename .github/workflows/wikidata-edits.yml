name: wikidata-edits

# Executes a REVIEWED batch of Wikidata edits through the bot-password account.
#
# Triggers are workflow_dispatch and schedule ONLY. Never add push: or
# pull_request: — this repo is private and Actions minutes are billable
# (CLAUDE.md § "Cost: this repo is private, so CI is manual-only").
#
# The scheduled run does nothing before START_DATE. Emma's instruction,
# 2026-08-13: the actions start properly on 1 September 2026.
#
# Default is a DRY RUN. A live run requires dispatching with dry_run: false.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the edits without sending them"
        type: boolean
        default: true
      limit:
        description: "Maximum edits this run (cadence is 10-100/day)"
        type: string
        default: "10"
      batch:
        description: "Path to the reviewed batch file"
        type: string
        default: "out/wikidata/unlinked-items.json"
  # No `schedule:` and no `push:`. `tests/test_repo_invariants.py` fails on any
  # automatic trigger and CLAUDE.md § "Cost: this repo is private, so CI is
  # manual-only" says why: Actions minutes are billable here. A daily cron was
  # present and failing that test; removed 2026-08-14. Restoring it is one
  # `- cron:` line, and needs the test and CLAUDE.md changed in the same commit.

concurrency:
  group: wikidata-edits
  cancel-in-progress: false

permissions:
  contents: read

env:
  WIKIDATA_API: https://www.wikidata.org/w/api.php
  START_DATE: "2026-09-01"

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hold until the start date
        id: gate
        run: |
          today=$(date -u +%F)
          if [[ "$today" < "$START_DATE" ]]; then
            echo "today=$today is before START_DATE=$START_DATE — nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.11"

      # THE START DATE, and it is this repo's own. It used to read a lockout state
      # file belonging to shintowiki-scripts; Emma, 2026-08-23: "Shintowiki scripts
      # and this one are not the same and not really coordinated." The coordination
      # was invented by an earlier session, and because the check failed closed it
      # would have blocked this repo from 2026-09-01 for another repo's reason.
      # scripts/wikidata-edit-run.py checks the same date on the live path, so a
      # local run is covered. FAILS CLOSED: an unreadable date == locked.
      - name: Wikidata start-date guard
        id: lockout
        if: steps.gate.outputs.go == 'true'
        run: |
          if python scripts/wikidata_lockout.py; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Wikidata start date::NOT YET — no edits will be sent."
          fi

      - name: Check the secrets are present
        if: steps.gate.outputs.go == 'true' && steps.lockout.outputs.open == 'true'
        env:
          USER_SECRET: ${{ secrets.USERNAME }}
          BOT_SECRET: ${{ secrets.BOT_NAME }}
          PASS_SECRET: ${{ secrets.BOT_PASSWORD }}
          BOT_CONTACT: ${{ secrets.BOT_CONTACT }}
        run: |
          missing=0
          [[ -z "$USER_SECRET" ]] && { echo "::error::USERNAME is not set"; missing=1; }
          [[ -z "$BOT_SECRET" ]] && { echo "::error::BOT_NAME is not set"; missing=1; }
          [[ -z "$PASS_SECRET" ]] && { echo "::error::BOT_PASSWORD is not set"; missing=1; }
          [[ "$missing" == 1 ]] && exit 1
          echo "all three secrets present"

      - name: Run the batch
        if: steps.gate.outputs.go == 'true' && steps.lockout.outputs.open == 'true'
        env:
          USERNAME: ${{ secrets.USERNAME }}
          BOT_NAME: ${{ secrets.BOT_NAME }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          BOT_CONTACT: ${{ secrets.BOT_CONTACT }}
          PYTHONPATH: src
        run: |
          python scripts/wikidata-edit-run.py \
            --batch "${{ inputs.batch || 'out/wikidata/unlinked-items.json' }}" \
            --limit "${{ inputs.limit || '10' }}" \
            ${{ (inputs.dry_run == false) && '--live' || '--dry-run' }}

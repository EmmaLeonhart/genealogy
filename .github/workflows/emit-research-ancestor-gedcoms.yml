name: emit-research-ancestor-gedcoms

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/emit-ancestor-gedcoms.py"
      - ".github/workflows/emit-research-ancestor-gedcoms.yml"

permissions:
  contents: write

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Emit ancestor GEDCOMs from derived CSVs
        run: python scripts/emit-ancestor-gedcoms.py

      - name: Commit and push research-exports GEDCOMs
        run: |
          set -euo pipefail
          git config user.name "Emma Leonhart"
          git config user.email "contact@emmaleonhart.com"
          mkdir -p research-exports
          git add research-exports/tang-ancestors.ged research-exports/leonhart-ancestors.ged
          if git diff --cached --quiet; then
            echo "No GEDCOM changes to commit"
            ls -lh research-exports/ || true
            exit 0
          fi
          git commit -m "Add synoptic ancestor GEDCOMs for Tang DFA seeds and Leonhart"
          git push origin HEAD:main

name: The parentless-sibling worklist

# ⛔ **THIS EXISTS SO THE LIST DOES NOT WAIT 90 MINUTES FOR A TREE IT DOES NOT READ.**
#
# `scripts/sibling-pair-worklist.py` reads `exports/tiny-paths/` and `geni-families/` and nothing
# else. It does not read `out/merged.ged`, so pinning it to `tree.yml` -- which rebuilds the whole
# synoptic tree first -- means the list is only ever as fresh as the last full rebuild, and a
# rebuild is 90 minutes. The step stays in `tree.yml` as well, because the numbers are the same
# either way and a rebuild should not leave a stale list behind it.
#
# **What the list is.** A path GEDCOM writes a sibling pair as a family with two `CHIL` and no
# partners -- Geni records no sibling edge, so a path can only say *these two are siblings*. The
# parents arrive from the members' own profile pages, and this is who still needs that scrape.
#
# It had never been called by anything until 2026-09-16: the committed report was a photograph of
# 2026-09-06, 2,130 pairs, taken when the corpus held a few hundred paths against 13,000-plus now.

on:
  workflow_dispatch:
  # Every new path GEDCOM is a new sibling pair, so this is exactly when the list goes stale.
  push:
    branches: [main]
    paths:
      - "exports/tiny-paths/**"
      - "geni-families/**"
      - "scripts/sibling-pair-worklist.py"

permissions:
  contents: write

concurrency:
  group: sibling-worklist
  cancel-in-progress: true

jobs:
  worklist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Sparse, because the repo is 13+ GB tracked and this job reads three paths.
      # `sparse-checkout-cone-mode: false` is what lets a single FILE be named.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts
            /src
            /exports/tiny-paths
            /geni-families
            /reports/sibling-pair-worklist.tsv
            /reports/sibling-pair-scrape-targets.tsv

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild the list
        env:
          PYTHONPATH: src
        run: |
          before=$(wc -l < reports/sibling-pair-worklist.tsv 2>/dev/null || echo 0)
          python scripts/sibling-pair-worklist.py
          after=$(wc -l < reports/sibling-pair-worklist.tsv 2>/dev/null || echo 0)
          echo "rows before: $before  after: $after"
          head -3 reports/sibling-pair-worklist.tsv

      - name: Commit it
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sibling-pair-worklist.tsv reports/sibling-pair-scrape-targets.tsv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "the list did not change"
            exit 0
          fi
          git commit -m "the parentless-sibling worklist, regenerated"
          # tree.yml and the session both push to main; retry rather than lose the run.
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1

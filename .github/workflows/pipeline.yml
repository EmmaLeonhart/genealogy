name: Pipeline when the account has been editing

# **The design, 2026-09-01:** every six hours it checks the time of the last contribution. If it
# is under six hours old it does the full pipeline. Ledger refresh plus QuickStatements
# rebuild. So basically it is intended as facilitating potentially quite intensive work like
# this."*
#
# **The gate is what makes it affordable.** The pipeline checks out several GB and rebuilds the
# batch; run unconditionally that is four expensive runs a day whether or not anything changed.
# The contributions are the right signal because the ledger is BUILT from them --
# `refresh-garborg-ledger.py` reads the same `list=usercontribs` for the same account, so "the
# account has edited" and "the ledger will differ" are the same fact.
#
# **It does NOT rebuild the synoptic tree.** That is `genimerge merge`: ~14 minutes and a 17 GB
# peak against a 16 GB runner, so it cannot run here — and it does not need to. `--compose` reads
# the derived CSVs, and `CLAUDE.md` says 90% of the time the tree should not be rebuilt anyway.
#
# **Memory is instrumented rather than assumed.** Two slow test modules were killed four times on
# this same runner size before anyone measured; `/usr/bin/time -v` and a 30-second sampler are
# here so that if compose is also too big for 16 GB the log says so, instead of the job dying
# with `The runner has received a shutdown signal` and nobody knowing why.

on:
  # **`push:` IS DELIBERATE HERE, and it is the one workflow that has it.** Ruled 2026-09-03:
  # a push triggers the pipeline all the way, up to a working `.qs` file and the daily batch on
  # the site. This reverses CLAUDE.md's blanket ban, which
  # is updated in the same commit; every other workflow stays manual-or-scheduled.
  #
  # **It cannot loop.** This job pushes its own commit to `main`, which would retrigger the
  # workflow but for a documented GitHub rule: a push made with the repository's `GITHUB_TOKEN`
  # does not create a new workflow run. `actions/checkout` persists that token and the commit is
  # authored by `github-actions[bot]`, so the pipeline's own push is inert. A push from a person
  # or a Claude session is what starts a run.
  #
  # `concurrency: pipeline` with `cancel-in-progress: false` still holds, so a run that is
  # MID-PUSH is never cancelled -- which is the half that matters, since that is the failure
  # `cancel-in-progress: true` would cause.
  #
  # **It is not a queue of many, though, and this comment used to imply one.** GitHub holds at
  # most ONE pending run per concurrency group: a newer push cancels the one waiting, not the one
  # running. Measured on 2026-09-09 -- run 471 was created 20:23:16 and cancelled 20:27:06 as 472
  # arrived at 20:27:04; 472 was cancelled 20:30:18 as 473 arrived at 20:30:17.
  #
  # That is benign and is arguably what you want -- the superseded run would have rebuilt from an
  # older sha, and the survivor's checkout contains its commits anyway -- but it means a burst of
  # three pushes produces two runs, not three. Do not read a cancelled pending run as a failure,
  # and do not push again while waiting on one if the point is to watch that run.
  push:
    branches: [main]
  schedule:
    # ⛔ **ONCE A DAY, PLUS ON PUSH. Ruled 2026-09-19:** *"this thing runs once a day and
    # also at push"*. It was every six hours -- `23 1,7,13,19` -- and that is now wrong for a
    # measured reason rather than a preference: each compose is a FRESH PICK, so four runs a day
    # deal four batches against a budget of `DAILY_CREATION_CAP` = 500 creations, and the bot
    # account has neither `noratelimit` nor `apihighlimits`. Everything past the cap comes back
    # `no-automatic-entity-id`, so the extra runs bought refusals, not people.
    #
    # 07:23 is the slot kept, and the reason is unchanged: `wikidata-edits.yml` sends at 08:07,
    # so this lands after the rebuild and before the send. Off the hour because every scheduled
    # workflow on GitHub fires at :00 and the queue is worst there.
    - cron: "23 7 * * *"
  # ⛔ `workflow_call`, so `redo-everything.yml` can chain this. A workflow dispatched
  # with GITHUB_TOKEN creates no run, so chaining cannot go through `gh workflow run`.
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the last contribution is older than six hours"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# Never two pipelines at once, and never cancel one that is mid-push.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /.github
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # **A PUSH BYPASSES THE GATE, and that is the whole point of the trigger.** The gate asks
      # whether the account has edited Wikidata in six hours; a push means the REPO changed,
      # which the gate cannot see. Gating pushes on contributions would reproduce exactly the failure
      # of 2026-09-03, where three scheduled runs skipped and the site served a batch from the
      # night before while every run showed green. "All the way" means the gate does not stop it.
      # ⛔ **WHILE THE ADMINISTRATORS' NOTICEBOARD MENTIONS 日巫女, NO RUN COMPOSES ANYTHING.**
      # Ruled 2026-09-24: *"only runs of even generations of quickstatements happen only after
      # the string is not present on that page."* Every event -- schedule, push, dispatch, call,
      # `force` included; nothing bypasses it. Fails closed: unreadable == held.
      # ⛔ SUSPENDED UNTIL 2026-10-05 (ruled 2026-09-25, scripts/wikidata-edit-run.py
      # NOTICEBOARD_RESUMES): before that date (UTC) the page is not read.
      - id: check
        run: |
          if [[ "$(date -u +%F)" < "2026-10-05" ]]; then
            echo "noticeboard check suspended until 2026-10-05"
            page="suspended"
          else
          page=$(curl -fsSL --retry 3 --max-time 60 \
            -A "genealogy-noticeboard-gate/1.0 (https://github.com/EmmaLeonhart/genealogy)" \
            "https://www.wikidata.org/w/index.php?title=Wikidata:Administrators%27_noticeboard&action=raw") || page=""
          fi
          if [ -z "$page" ] || grep -qF '日巫女' <<<"$page"; then
            echo "HELD: the Administrators' noticeboard mentions 日巫女, or could not be read"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "forced: event=${{ github.event_name }} force=${{ inputs.force }}"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python .github/scripts/last_contribution.py --max 6; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  pipeline:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # ⛔ **90 MINUTES WAS NOT ENOUGH AND THE OVERRUN READS AS A CANCELLATION.** Run
    # 35472275961 was killed at exactly 90 minutes, inside `Commit the rebuilt batch` -- so it
    # had done the work and died handing it over. GitHub reports a `timeout-minutes` kill as
    # **`cancelled`**, which is indistinguishable in `gh run list` from the supersede-on-push
    # cancellation this file already documents at length. That cost two wrong diagnoses on
    # 2026-09-19: first that CI's own bot pushes were cancelling it, then that a human push was.
    # The instrument that settles it is the JOB's start and end time against this number, never
    # the conclusion word.
    #
    # The last green run took 1h00m, so 90 left ten minutes of headroom against a corpus that
    # grows every day. 150 is not a guess at the new runtime -- it is the old margin restored on
    # top of a job that has been measured at an hour and is trending up.
    timeout-minutes: 150
    # The commit this job PUSHES, so the site job can build from it. Empty when nothing
    # changed, and the site then falls back to github.sha.
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # `out/` is needed for the name-item store the live reuse check reads, `reports/` for the
      # derived CSVs compose reads. `exports/` is NOT needed: nothing here touches the corpus,
      # which is what makes this affordable where a tree rebuild is not.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/wikidata
            !/paths_for_wikidata_isolates
            !/exports
            !/geni-scraping
            !/orderlife
            !/geni_pages
            !/chats
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Before
        run: free -m; df -h / | tail -1

      # ⛔ **FIRST, BECAUSE THE ALTERNATIVE IS FINDING OUT AN HOUR IN.** On 2026-09-19 a
      # tracked file reached 100.32 MB, GitHub's pre-receive hook declined every push
      # containing it, and this job did 68 minutes of work and had all five push attempts
      # rejected -- every run, for four hours. It was invisible because `timeout-minutes`
      # killed the job mid-retry and GitHub reports a timeout kill as `cancelled`, the same
      # word as the supersede-on-push cancellation, so it was read as push contention twice.
      #
      # The check is two seconds and it runs before anything is spent. It is NOT
      # `continue-on-error` like the census steps below: a file at 95 MB means this run's
      # push is already doomed, and the whole point is to say so now rather than at the end.
      - name: Nothing is approaching GitHub's 100 MB hard limit
        run: python scripts/check-file-sizes.py --strict

      - name: Unpack the derived CSVs
        run: python scripts/pack-derived.py --unpack

      # ⛔ THE ROSTERS ARE REFRESHED DAILY, HERE. Ruled 2026-09-24: *"We need to update our
      # rosters of these since they change a lot and it can lead to outdated stuff."* `tree.yml`
      # only runs on a push to `exports/**` or by hand, so a refresh that lives only there is a
      # refresh that happens when somebody remembers. `p2600-all.tsv` is what forty scripts join
      # through; `p2889-all.tsv` is the FamilySearch zipper's anchors. An outage keeps the
      # committed copy -- the script refuses a short fetch and never writes one.
      - name: Refresh the P2600 and P2889 rosters
        continue-on-error: true
        env:
          BOT_CONTACT: emma@topazcomputing.com
          PYTHONPATH: src
        run: |
          python scripts/refresh-p2600-all.py
          python scripts/refresh-p2600-all.py --p2889

      # `--compose` refreshes the ledger itself — `CLAUDE.md`: regenerating the QuickStatements
      # ALWAYS regenerates the ledger — so there is no separate refresh step to forget.
      # ⛔ **BEFORE THE COMPOSE, because the compose READS what this writes.**
      # `build-garborg-day._piped_label_fixes` emits the resolved rows of
      # `reports/title-label-proposals.tsv`; `apply-pipe-labels.py` is what resolves them, by
      # calling `scripts/pipelabels.py` — the reader that was built, tested and then called by
      # nothing. `CLAUDE.md` § *Code that is WRITTEN but never CALLED is not done*.
      #
      # It is here as well as in `rebuild-everything.py` because this workflow does NOT run that
      # script — it composes the batch directly — so the step would otherwise reach the batch
      # only on a hand rebuild. It reads one committed TSV, takes about a second, and is
      # idempotent: it reads `live_mul`/`leading_title`, never its own `proposed_label`.
      - name: Read the ruled pipe into the label proposals
        run: python scripts/apply-pipe-labels.py

      # ⛔ THE LABEL SLOTS A HUMAN HAS ALREADY RULED ON, refreshed BEFORE the batch is
      # composed. Ruled 2026-09-15, queue.md § *Unintentional edit wars*:
      # *"our algorithm is relatively resistant to editors fixing its mistakes and this is
      # drawing attention."*
      #
      # **Staleness is the failure this is written against, and it is not hypothetical.**
      # reports/suppressed-statements.tsv is the statement-level equivalent and it is wired into
      # nothing: last written 2026-09-01, 15 rows, one editor. The mechanism was right and
      # frozen, so every removal since was invisible and the batch re-added all of them. A guard
      # that is not refreshed is a guard that expires.
      #
      # **Order matters and is the whole point of this step's position**: it must run BEFORE the
      # compose below, or the guard reads yesterday's file and the war continues for a day
      # longer than it needs to. It was first written after the split, which is after compose,
      # and that was wrong.
      #
      # It reads the ACCOUNT'S OWN contributions and names nobody, so it is not the thing ruled
      # against in refresh-suppressed-statements.py -- that ruling is about watching another
      # editor continuously.
      - name: Refresh the reverted label slots
        continue-on-error: true
        env:
          PYTHONPATH: src
          BOT_CONTACT: emma@topazcomputing.com
        run: python scripts/refresh-reverted-labels.py

      # ⛔ **BEFORE THE COMPOSE, because the compose reads it.** A person this lists as colliding
      # anywhere in the corpus gets the Geni id alone as the description (ruled 2026-09-23).
      - name: Description uniqueness measurement
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/build-description-audit.py

      - name: Ledger refresh and QuickStatements rebuild
        env:
          BOT_CONTACT: emma@topazcomputing.com
          PYTHONPATH: src
        run: |
          ( while true; do
              echo "MEM $(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/{print "used="$3"MB avail="$7"MB"}')"
              sleep 30
            done ) &
          SAMPLER=$!
          set +e
          /usr/bin/time -v python scripts/build-garborg-day.py --compose
          STATUS=$?
          set -e
          kill $SAMPLER 2>/dev/null || true
          exit $STATUS

      # ⛔ **THE OTHER TWO GENERATORS THE BATCH NEEDS, which nothing ran until 2026-09-05.**
      #
      # Raised when both turned out to be standalone: they were assumed already folded in, and
      # both are important, so leaving them standalone was worrying. They were not folded in, and the audit found the reason is
      # general: `reports/qs-batch-audit.md` measured **0 of 27** `.qs` files as produced by
      # anything this pipeline runs.
      #
      # Neither is duplicative, measured by running them fresh rather than by reading them:
      #
      #   build-regnal-ordinals       6 P7338, against ZERO in the live batch
      #   build-from-diff             what the model-vs-reality diff says the item lacks
      #
      # ⛔ `build-missing-reciprocals` WAS in this step for one commit and has been taken out.
      # It was added on the claim that it emits what Wikidata is missing, and that was wrong:
      # the script does **no live check**, by instruction recorded in it -- so its 6,770
      # statements are everything our tree records among 2,274 touched
      # people, re-asserted wholesale for QuickStatements to deduplicate. That is a reasonable
      # design for a file run by hand and a bad one to pour into the reviewed batch:
      # the daily batch emits 39 `P40` because it CHECKS, and this would have added 1,542 more
      # that are mostly already stated. The ruling on being shown the framing: nothing with
      # those properties is addable right now, since none of them are in the ledger.
      #
      # P22/P25/P40/P26 are uncapped on purpose -- `CLAUDE.md`: *"they are few per person and
      # each one is structurally load-bearing"* -- while `P3373` stays under `SIBLING_CAP`, which
      # is what the held file is for. So folding these in respects the designed pacing rather
      # than working around it.
      #
      # `continue-on-error` for the same reason the deck has it: the Garborg batch is the
      # deliverable and must not be lost to a failure in a batch that rides along.
      - name: Build the regnal-ordinal and diff batches
        continue-on-error: true
        env:
          BOT_CONTACT: emma@topazcomputing.com
          PYTHONPATH: src
        run: |
          python scripts/build-regnal-ordinals.py
          # ⛔ REFRESH THE SNAPSHOT FIRST, or `build-from-diff` contributes NOTHING.
          #
          # Reviewed 2026-09-06 as a queue item. The script refuses a diff older than 24h -- for
          # a good reason, since a stale diff proposes re-adding hand-work -- and NOTHING
          # in this pipeline was refreshing it. `out/model-vs-reality-items.json` is tracked and
          # was dated 2026-09-03, so every run since 09-04 refused. Measured by running it:
          # *"the diff rests on a snapshot 69.2 hours old ... refusing to project"*.
          #
          # And it EXITS 0 when it refuses, so the `|| echo` below never fired and the step
          # looked clean. A generator wired in on the claim that it *"emits what the diff says
          # the item lacks"* had emitted nothing for two days, silently -- the same shape as
          # `build-missing-reciprocals`, which sat in this step on a similar claim and was
          # removed.
          #
          # The refresh is 1,203 ledger items at 50 an request = **25 batched calls**, the same
          # order as the ~15 the deck step already makes below. `CLAUDE.md` § *Querying Wikidata
          # is ALLOWED* -- batch where the API batches, which this does.
          python scripts/model-vs-reality.py --refetch || echo "diff refresh failed; from-diff will refuse"
          python scripts/build-from-diff.py || echo "from-diff skipped: needs a diff to read"

      # ⛔ **EVERY PAGE THE SITE PUBLISHES IS REGENERATED HERE, and until 2026-09-09 only one
      # of them was.** The `site` job below copies whatever `out/` holds at the sha this job
      # pushes -- it generates nothing itself -- so a page whose generator no workflow runs is
      # published forever as whatever was last committed by hand. Measured before the change:
      #
      #     parent-review.html          build-parent-candidates.py          this pipeline
      #     family-review.html          build-family-candidates.py          review-decks.yml ONLY
      #     pick-one-review.html        build-pick-one-candidates.py        review-decks.yml ONLY
      #     patronymic-identifications  build-patronymic-identifications    NOTHING RAN IT
      #
      # `review-decks.yml` is `workflow_dispatch` only, so two of the three decks refreshed
      # exactly when somebody remembered to ask. That is the *"photograph, not a mirror"* failure
      # `CLAUDE.md` names for the derived tables, in the one place a stale page is read by hand
      # and acted on: `CLAUDE.md` § *THE PARENT DECK* -- *"an already-answered card wastes a
      # turn"*. The decks retire what has been answered on every rebuild, so a deck that does not
      # rebuild is a deck that re-asks.
      #
      # **`review-decks.yml` stays**, and is not made redundant by this. Its own header says why:
      # asking for a deck through the pipeline means waiting on a ledger refresh and a
      # QuickStatements compose and inheriting every way that batch commit can fail. This is the
      # automatic path; that one is the on-demand path.
      #
      # **One step each, and `continue-on-error` on every one**, for the reason the parent deck
      # already had it: the QuickStatements are the deliverable and a Wikidata hiccup in a page
      # that rides along must not lose a run that has already produced them. Separate steps mean
      # a failure in the widest deck still leaves the two before it rebuilt, which is the ordering
      # `review-decks.yml` uses and for the same reason.
      - name: Rebuild the parent deck
        continue-on-error: true
        env:
          BOT_CONTACT: emma@topazcomputing.com
          PYTHONPATH: src
        run: python scripts/build-parent-candidates.py

      # The child and sibling slots. Thousands of cards against the parent deck's handful, so
      # this is where the label fetch actually costs minutes.
      - name: Rebuild the child and sibling deck
        continue-on-error: true
        env:
          BOT_CONTACT: emma@topazcomputing.com
          PYTHONPATH: src
        run: python scripts/build-family-candidates.py

      # The ambiguous shape of those same slots, and the widest of the three: 21,628 census rows
      # over 5,469 distinct candidate items, and `wikidata_facts` resolves names for the WHOLE
      # census before `DECK_CAP` windows it to 1,000 cards. `deck.fetch_labels` batches 50 an
      # request and sleeps 0.4s between them -- `CLAUDE.md` § *Querying Wikidata is ALLOWED. Be
      # polite about the rate* -- so this is minutes, not seconds. It runs last so a failure here
      # leaves both decks above already rebuilt.
      - name: Rebuild the pick-one deck
        continue-on-error: true
        env:
          BOT_CONTACT: emma@topazcomputing.com
          PYTHONPATH: src
        run: python scripts/build-pick-one-candidates.py

      # Pure local work -- it reads two tracked TSVs and writes the page, no network at all --
      # so it is the cheapest thing in this block and the one that had never run in CI.
      - name: Rebuild the patronymic identifications page
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/build-patronymic-identifications-page.py

      # **`out/site/` is TRACKED, so it goes stale like any other committed derived file.** The
      # `site` job builds its own copy from `out/` and publishes that, so Pages is correct either
      # way -- but the committed snapshot is what anyone reading the repo sees, and on 2026-09-09
      # it still held five pages from 2026-09-07 with the two newest decks missing entirely.
      # Rebuilding it here is what makes `git status` the honest signal it is everywhere else.
      # ⛔ SPLIT BEFORE THE SITE IS BUILT. The page serves the manual half, so the split has
      # to exist by the time `build-pages-site.py` runs. Ruled 2026-09-14: *"Produce disjoint
      # quickstatements on the github page too."*
      # ⛔ **ONE COMPOSE, THEN THE SPLIT. TWO COMPOSES ARE IMPOSSIBLE HERE.**
      #
      # `--half auto` / `--half manual` as two invocations was tried on 2026-09-17 and removed
      # the same hour: **`--compose` ADVANCES THE SEQUENCE.** It consumes and rewrites
      # `reports/garborg-carry-forward.tsv`, and the composer's own argument parser records the
      # measurement -- re-running it on the same day produced a batch differing by *"19 people
      # out and 17 in -- the next hop, not today's"*. So two runs are two different DAYS, and any
      # disjointness between them is coincidence.
      #
      # `split-daily-batch.py` gives the same result from one composition: individual creations
      # dealt a third / two thirds, everything else written to BOTH files, which is the ruling --
      # *"two parallel generations of all of the same stuff ... connectivity 100% on both"*.
      - name: Split the daily batch into the automatic and manual halves
        env:
          PYTHONPATH: src
        run: python scripts/split-daily-batch.py

      # ⛔ FAMILYSEARCH, AND IT IS DELIBERATELY NOT PART OF THE SPLIT ABOVE. Ruled 2026-09-21:
      # *"I want to have a pipeline that creates duplicates of familysearch vs geni but we can
      # manually merge it. Makes separate quickstatements."* Its own file, so the duplicates it
      # creates are reviewable and mergeable as a SET rather than mixed into edits that are
      # meant to be unique -- which is why it runs after the split and feeds neither half.
      #
      # It regenerates here rather than in a session because `CLAUDE.md` § *Code that is
      # WRITTEN but never CALLED is not done*: the bridge grows every time one of these items
      # gets a `P2889`, so a snapshot committed by hand is wrong the day after it is made.
      - name: The FamilySearch batch, its own file
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/build-familysearch-day.py

      # ⛔ THE UNIVERSE-GROWTH PASS, APPENDED TO BOTH HALVES AFTER THE SPLIT. Ruled
      # 2026-09-14: adding `P1810` to existing `P2600` statements is a true, harmless, missing
      # statement — and the point is that editing an item makes it OURS, so the universe grows
      # by a paced number of neighbours a day. 40 into the file a person pastes, 20 into the
      # run that goes out unattended, which is the pace Emma set: *"40 people in the quick
      # statements batch and then 20 people in the CICD edits."*
      #
      # It runs AFTER the split so the split's own arithmetic is not disturbed, and appends
      # rather than composing into the batch, so the two products stay separable.
      # ⛔ **A GROWTH PASS APPENDS TO THE DAY BATCH AS WELL AS TO A HALF, OR THE SPLIT IS
      # STALE THE MOMENT IT IS MADE.** The split runs above, then these three passes cat
      # their output onto the halves only -- so the halves grew and the day batch did not.
      # Measured 2026-09-18: 1,184 lines in the auto half and 2,163 in the manual half were
      # in NEITHER the day batch nor any split of it, and the day batch read clean through
      # a locality gate that the halves failed 21 and 48 items.
      # The day batch is the composition; a half is a share of it. A half holding lines the
      # composition does not is not a share of anything.
      - name: Subject-named-as backfill, the universe-growth pass
        continue-on-error: true
        env:
          PYTHONPATH: src
          BOT_CONTACT: emma@topazcomputing.com
        run: |
          python scripts/build-subject-named-as-backfill.py
          if [ -s reports/wikidata-subject-named-as-auto.qs ]; then
            cat reports/wikidata-subject-named-as-auto.qs >> reports/wikidata-garborg-day-auto.txt
            cat reports/wikidata-subject-named-as-auto.qs >> reports/wikidata-garborg-day.txt
            echo "appended $(grep -c P1810 reports/wikidata-subject-named-as-auto.qs) to the auto half"
          fi
          if [ -s reports/wikidata-subject-named-as.qs ]; then
            cat reports/wikidata-subject-named-as.qs >> reports/wikidata-garborg-day-manual.txt
            cat reports/wikidata-subject-named-as.qs >> reports/wikidata-garborg-day.txt
            echo "appended $(grep -c P1810 reports/wikidata-subject-named-as.qs) to the manual half"
          fi

      # ⛔ THE SECOND VEHICLE FOR THE SAME PASS. Ruled 2026-09-14, alongside the first:
      # *"adding sources on individuals for existing relationships for the people adjacent to
      # the universe. That's another thing, because our universe doesn't really expand itself
      # past the people we're creating and that's a bit of a problem."*
      #
      # Same locality, same 40/20 pace, same after-the-split append. It is STRICTER than the
      # P1810 pass in one way and has to be: `S2600` says *Geni states this*, so every line is
      # checked against our own tree first and a relationship Geni does not state is left
      # alone rather than cited to Geni. See the script's docstring.
      - name: Relationship-sources backfill, the universe-growth pass
        continue-on-error: true
        env:
          PYTHONPATH: src
          BOT_CONTACT: emma@topazcomputing.com
        run: |
          python scripts/build-relationship-sources-backfill.py
          if [ -s reports/wikidata-relationship-sources-auto.qs ]; then
            cat reports/wikidata-relationship-sources-auto.qs >> reports/wikidata-garborg-day-auto.txt
            cat reports/wikidata-relationship-sources-auto.qs >> reports/wikidata-garborg-day.txt
            echo "appended $(grep -c S2600 reports/wikidata-relationship-sources-auto.qs) to the auto half"
          fi
          if [ -s reports/wikidata-relationship-sources.qs ]; then
            cat reports/wikidata-relationship-sources.qs >> reports/wikidata-garborg-day-manual.txt
            cat reports/wikidata-relationship-sources.qs >> reports/wikidata-garborg-day.txt
            echo "appended $(grep -c S2600 reports/wikidata-relationship-sources.qs) to the manual half"
          fi

      # ⛔ **PATRONYMICS IN PAIRS, AND THE PAIRS GO OUT.** This step ran after the site build and
      # appended nowhere, so `wikidata-patronymic-pairs.qs` was composed every run and never sent
      # or published -- which is why no pair appeared on Wikidata (found 2026-09-26, no
      # `Helgesson`). Appended to all three day files like the growth passes above, before the
      # Tanba strip, the locality gate and the site.
      - name: Patronymic gendered pairs
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/build-patronymic-pairs.py
          # A pair block whose label + description the day file already CREATEs is skipped: the
          # name-item emitter mints `Jonsdotter` "patronymic" itself, and appending it again made
          # the pre-send duplicate guard fail edit run 36243640877 (2026-09-26), so nothing went out.
          if [ -s reports/wikidata-patronymic-pairs.qs ]; then
            python - <<'EOF'
          import re
          from pathlib import Path
          LABEL = re.compile(r'^LAST\t(?:Lmul|Len)\t"(.*)"$')
          DEN = re.compile(r'^LAST\tDen\t"(.*)"$')

          def blocks(lines):
              starts = [n for n, l in enumerate(lines) if l.strip() == "CREATE"]
              for i, a in enumerate(starts):
                  b = starts[i + 1] if i + 1 < len(starts) else len(lines)
                  yield a, b

          def keys(lines, a, b):
              labels = {m.group(1) for l in lines[a:b] for m in [LABEL.match(l)] if m}
              dens = [m.group(1) for l in lines[a:b] for m in [DEN.match(l)] if m]
              return {(x, dens[0]) for x in labels} if dens else set()

          pairs = Path("reports/wikidata-patronymic-pairs.qs").read_text(encoding="utf-8").splitlines()
          head = pairs[:next((n for n, l in enumerate(pairs) if l.strip() == "CREATE"), len(pairs))]
          for name in ("wikidata-garborg-day.txt", "wikidata-garborg-day-auto.txt",
                       "wikidata-garborg-day-manual.txt"):
              day = Path("reports") / name
              lines = day.read_text(encoding="utf-8").splitlines()
              made = set().union(*(keys(lines, a, b) for a, b in blocks(lines))) if lines else set()
              out, added, skipped = list(head), 0, 0
              for a, b in blocks(pairs):
                  k = keys(pairs, a, b)
                  if k & made:
                      skipped += 1
                      continue
                  made |= k
                  out.extend(pairs[a:b])
                  added += 1
              with day.open("a", encoding="utf-8", newline="\n") as f:
                  f.write("\n".join(out) + "\n")
              print(f"{name}: appended {added} pair creations, skipped {skipped} already created")
          EOF
          fi

      # ⛔ TANBA LAST. The composer drops Tanba lines, then the split and the appends above write
      # all three day files again, and the site on 2026-09-24 still showed 178 Tanba QIDs from
      # halves nothing re-checked. Dropped here, after every writer, comments included.
      - name: No Tanba line in any day file
        run: python scripts/strip_tanba_from_day_batch.py

      # ⛔ **THE LOCALITY GATE, CHECKED ON THE WRITTEN BATCH, BEFORE ANYTHING PUBLISHES IT.**
      # ⛔ **AND BEFORE THE SITE SNAPSHOT (moved 2026-09-24).** The site was built from the batch
      # before this strip ran, so it could publish what the gate was about to remove.
      #
      #
      # Added 2026-09-18, after nine `ja` labels were written onto Jan-1 entry points outside the
      # universe -- Q135525010, Q135579354 and seven more -- and were reverted by hand one at a
      # time. Behind them sat 936, 962 and 985 more non-local lines in the three day batches.
      #
      # **This step is here rather than only in `ci.yml` because the batch is published from this
      # workflow.** The nine reached Wikidata through a QuickStatements PASTE off the published
      # page, a route that never touches `wikidata-edit-run.py`, so a gate in the sender could not
      # have stopped them and a test that runs on some other workflow's schedule is too late. If
      # the batch composed in this run is bad, this run must fail before Pages serves it.
      #
      # `CLAUDE.md` § *AN EDIT GOES ON AN ITEM IN THE UNIVERSE, OR ONE STEP BEYOND IT. ALL EDITS,
      # NO EXCEPTIONS*, and § *THE KANJI SIGNAL DECIDES WHICH LABEL UNIVERSE A PERSON IS IN*.
      - name: The batch may not touch anything outside the universe
        env:
          PYTHONPATH: src
        # ⛔ STDLIB ONLY. The first version of this step ran pytest and failed with
        # `No module named pytest` on run 35329948498 -- this workflow installs nothing.
        # It failed CLOSED, which is right, but it had checked nothing: a gate that cannot
        # run is not a gate, and a red tick nobody can read as evidence is worse than none.
        # tests/test_batch_locality.py calls the same functions, so there is one
        # implementation and two callers.
        # ⛔ **`--fix` STRIPS BEFORE IT CHECKS, AND THAT IS THE POINT.** The composer already
        # gates the file it writes -- and then the three universe-growth passes above `cat`
        # their output onto all three day files, after the gate, ungated. On run 35398258982
        # that put 7 items past it: `Q141497327` a name item the people-universe can never
        # hold, and six strangers' items reached through `p2600-all.tsv`. The check then failed
        # the run, so the batch was composed, refused and thrown away -- every day, which is why
        # the three-ledger refactor has never once gone green.
        #
        # A check can only fail the run. Failing the run is the thing that has been stopping the
        # batch from ever landing, so the same rule is applied as a filter at the last point
        # that can see the whole file, and the check that follows passes on merit or fails for
        # a reason that is not this one.
        run: python scripts/check-batch-locality.py --fix

      - name: Refresh the committed site snapshot
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/build-pages-site.py

      # ⛔ THE INVENTORY IS GENERATED, SO CI GENERATES IT. `tests/test_generated_inventories.py`
      # asserts `reports/built-batches.tsv` names exactly the batch files on disk, and nothing ran
      # the generator -- so the file went stale the moment any batch was added and the test went
      # red and stayed red. It failed from at least 2026-09-10 to 2026-09-14 on
      # `On disk but unlisted: ['reports/wikidata-cjk-mul-labels.json']`.
      #
      # § *A page whose generator no workflow runs is published as a photograph*, with a red
      # build attached: a generated artefact that a test polices and no job rebuilds cannot stay
      # correct, because staying correct depends on a person remembering. It runs here, after
      # every batch this job writes and before `Commit the rebuilt batch` picks it up with
      # `git add -A`.
      # § *Code that is WRITTEN but never CALLED is not done.* The CJK backfill for existing
      # name items runs every pipeline, capped at LABEL_EDIT_CAP, so the 7,516 items missing a
      # reading drain steadily instead of waiting for someone to remember the script.
      - name: CJK readings for the name items this corpus bears
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/build-name-item-cjk.py

      - name: Refresh the batch inventory
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/audit-built-batches.py

      # The SAME trap, one file over, and green today only by luck. Two tests police
      # `reports/repo-freshness.csv` -- that it names no deleted file, and that every generator
      # it names still exists -- and nothing regenerated it either. It goes red the first time
      # a report or a script it lists is deleted, which is a thing this repo does routinely
      # (§ *LEGACY CODE IS DELETED*). Wired at the same time rather than waiting for it to fail,
      # because the answer to *is this something that should be in CI but isn't* is the whole
      # category, not the one instance that happened to go red first.
      - name: Refresh the repo freshness census
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/build-repo-freshness.py

      - name: What changed
        id: batch
        run: |
          FILE=reports/wikidata-garborg-day.txt
          echo "creates=$(grep -c '^CREATE' "$FILE" || true)" >> "$GITHUB_OUTPUT"
          echo "lines=$(grep -cve '^[[:space:]]*#' -e '^[[:space:]]*$' "$FILE" || true)" >> "$GITHUB_OUTPUT"
          echo "bytes=$(wc -c < "$FILE")" >> "$GITHUB_OUTPUT"
          echo "carried=$(( $(wc -l < reports/garborg-carry-forward.tsv) - 1 ))" >> "$GITHUB_OUTPUT"
          git status --short | head -20

      # Repack before committing: the plain CSVs are gitignored and the `.gz` are what is tracked.
      - name: Commit the rebuilt batch
        id: commit
        run: |
          python scripts/pack-derived.py
          # Again, because the step at the top of this job checked what was CHECKED OUT and
          # everything since has been regenerating files. A file that crossed during this run
          # fails here with its name in the log, instead of five rejected pushes and a
          # `cancelled` conclusion that means two different things.
          python scripts/check-file-sizes.py --strict
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed; not committing"
            exit 0
          fi
          printf '%s\n' \
            'rebuild the batch: the account edited within the last six hours' \
            '' \
            'Scheduled pipeline. The gate found a contribution newer than six hours, so' \
            'the ledger was refreshed from the contributions and build-garborg-day.py' \
            '--compose was re-run.' \
            '' \
            'The synoptic tree was NOT rebuilt: that needs 17 GB and this runner has 16,' \
            'and CLAUDE.md says 90% of the time it should not be rebuilt anyway.' \
            > /tmp/msg.txt
          git commit -F /tmp/msg.txt

          # THE PIPELINE COLLIDES WITH ITS OWN OUTPUT, and that is what this loop is for.
          # `actions/checkout` above takes `github.sha` -- the commit that TRIGGERED this
          # run -- not the tip of `main`. So when two pushes land close together the second
          # run rebuilds from a base that predates the FIRST run's output commit, and
          # rebasing its regenerated files onto the first run's regenerated files conflicts
          # every time. Measured 2026-09-06: runs 199, 200, 202 and 205 all died right here,
          # and `site` is `needs: pipeline`, so Pages stopped republishing with them.
          #
          # Every conflicting path is a GENERATED file, by construction: the commit being
          # replayed holds only what the rebuild changed, and a conflict needs both sides to
          # have touched the path. The newest rebuild is the right one -- it ran the ledger
          # refresh last -- and during a rebase git replays OUR commit onto upstream, so the
          # version to keep is the confusingly-named `--theirs`.
          # ⛔ **EVERY GIT CALL IN THIS LOOP IS BOUNDED.** A hang here is invisible: the step
          # prints nothing, the job runs to `timeout-minutes` and the conclusion word is
          # `cancelled`, which is the same word a superseded run gets. Two confident wrong
          # diagnoses came out of reading that word on 2026-09-19. A bounded call fails in
          # minutes with its own name in the log instead.
          # ⛔ **BOUNDING EACH CALL IS NOT BOUNDING THE LOOP, AND THE ARITHMETIC SAYS SO.**
          # Five attempts of `timeout 900` pull + `timeout 600` resolve + `timeout 900` push is
          # **200 minutes** against this job's `timeout-minutes: 150` -- of which roughly 90 are
          # already spent by the time this step starts. So the per-call timeouts added when the
          # 58-minute hang was fixed still allow the loop to consume the whole job and report
          # `cancelled`, which is the exact ambiguity they were added to remove. Caught by
          # arithmetic on 2026-09-22, not by another lost run.
          #
          # A DEADLINE fixes what per-call bounds cannot: no attempt begins past it, and the
          # step fails with its own message while the job still has time to run its cleanup.
          # 30 minutes is chosen against the measurement -- the last green run took 94 minutes
          # end to end and its commit step was a small part of that.
          deadline=$(( $(date +%s) + 1800 ))
          for attempt in 1 2 3 4 5; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=Commit step out of time::gave up after $((attempt - 1)) attempt(s); 30 minutes is the budget and the job would otherwise run to its own timeout and report the ambiguous 'cancelled'. The batch is composed and committed locally; the next run recomposes it."
              exit 1
            fi
            if ! timeout 900 git pull --rebase origin main; then
              unmerged="$(git diff --name-only --diff-filter=U)"
              if [ -z "$unmerged" ]; then
                echo "::error::rebase stopped with no conflicted paths -- not guessing"
                git rebase --abort || true
                exit 1
              fi
              echo "resolving in favour of this run's rebuild:"
              printf '%s\n' "$unmerged"
              # `git checkout --theirs` writes the WORKING TREE and leaves the index
              # unmerged, so the `git add -A` on the next line is what actually resolves
              # the conflict -- and it also stages a delete/modify conflict correctly,
              # since the file is simply absent. Reversing these two lines deletes every
              # conflicted file instead of keeping it, which an earlier draft did.
              # ⛔ **`-- .` WALKED THE WHOLE TREE AND HUNG THE JOB FOR 58 MINUTES.** Measured
              # on run 35682558066, 2026-09-22: the conflict list printed at 05:04:32, nothing
              # was logged again, and the job was killed at 06:02:28 on its 150-minute
              # `timeout-minutes` with `Terminate orphan process: (git)`. `cancelled` in the
              # listing, and CLAUDE.md § *`cancelled` IS TWO DIFFERENT EVENTS* is exactly about
              # not reading that word as a supersede: the duration says timeout kill.
              #
              # The cause is the checkout above being a PARTIAL clone -- `filter: blob:none`
              # with a non-cone sparse checkout. `git checkout --theirs -- .` asks git to
              # materialise every path in a 13 GB repo, and every blob it does not have is a
              # separate lazy fetch over the network. `$unmerged` is already in hand one line
              # up and only an unmerged path HAS a `--theirs` side, so naming the paths is
              # identical in effect and bounded by the size of the conflict.
              #
              # `--diff-filter=U -z` straight into `xargs -0`, which is the canonical
              # NUL-safe form: a generated path may contain a space, and word-splitting the
              # `$unmerged` variable would resolve the wrong file. Re-asking git rather than
              # reusing the variable also avoids a trailing empty argument.
              git diff --name-only --diff-filter=U -z                 | timeout 600 xargs -0 -r git checkout --theirs -- 2>/dev/null || true
              git add -A
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "::error::paths still unmerged after resolution"
                git rebase --abort || true
                exit 1
              fi
              # A resolution that silently did nothing leaves conflict markers in a tracked
              # file, and committing THAT is worse than the failure this loop replaces. An
              # earlier draft did exactly that, because `read -d` is a bashism the loop
              # above no longer relies on. Refuse rather than push a marker.
              # ⛔ ONLY THE RESOLVED PATHS. Over the whole index, `git grep --cached` on this
              # `blob:none` partial clone downloads EVERY blob in the repo, one lazy fetch at a
              # time: run 35970562188 (and 35937363940 before it) printed the resolved list and
              # then hung 30+ minutes with orphaned git processes until the job timeout killed
              # it. The resolved files were just checked out, so their blobs are already local.
              if printf '%s\n' "$unmerged" | timeout 120 xargs -r -d '\n' \
                  git grep -qI -e '^<<<<<<< ' -e '^>>>>>>> ' --cached --; then
                echo "::error::conflict markers survived resolution -- refusing to push"
                git rebase --abort || true
                exit 1
              fi
              # Resolving can leave the replayed commit identical to upstream, which is not
              # an error and is not something --continue will accept.
              if git diff --cached --quiet; then
                GIT_EDITOR=true git rebase --skip || { git rebase --abort || true; exit 1; }
              else
                GIT_EDITOR=true git rebase --continue || { git rebase --abort || true; exit 1; }
              fi
            fi
            if timeout 900 git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::push still rejected after 5 attempts"
              exit 1
            fi
            echo "push rejected -- origin moved again mid-rebase; retrying"
          done
          # AFTER the rebase and push: this is the sha now on main, and the one the site
          # must be built from. Without it the site publishes this commit's parent.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open the issue
        uses: actions/github-script@v7
        env:
          CREATES: ${{ steps.batch.outputs.creates }}
          LINES: ${{ steps.batch.outputs.lines }}
          CARRIED: ${{ steps.batch.outputs.carried }}
          BYTES: ${{ steps.batch.outputs.bytes }}
        with:
          script: |
            const fs = require('fs');
            const LIMIT = 65536;
            const batch = fs.readFileSync('reports/wikidata-garborg-day.txt', 'utf8');
            const when = new Date().toISOString().slice(0, 16).replace('T', ' ');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            // **The PAGE is the hand-off, never the artifact.** Ruled 2026-09-02: *"idk what
            // a github artifact is but a non-attached zip file in the email is way worse than
            // having the quickstatements just on a page on github pages lol, that's kinda why I
            // made github pages."* The batch is ~130 KB against a 65,536-byte issue-body limit,
            // so it ALWAYS overflows -- every notification hit the old artifact fallback, which
            // is why the notification kept saying the batch was being withheld.
            const site = 'https://emmaleonhart.github.io/genealogy';
            const head = [
              `**${process.env.CREATES} creations - ${process.env.LINES} statement lines - ` +
              `${process.env.CARRIED} carried forward**`,
              '',
              `### [Open the batch](${site}/wikidata-garborg-day.html)`,
              '',
              `Select-and-copy text, straight into QuickStatements. Also: ` +
              `[name items](${site}/wikidata-garborg-name-items.html) &middot; ` +
              `[adjudication deck](${site}/parent-review.html) &middot; ` +
              `[site](${site}/).`,
              '',
              'Rebuilt because you edited Wikidata in the last six hours. The ledger was',
              'refreshed; the synoptic tree was not.',
              '',
            ].join('\n');
            const wrapped = head + '```\n' + batch + '\n```\n';
            const body = wrapped.length <= LIMIT
              ? wrapped
              : head + `The batch is ${process.env.BYTES} bytes, past the ${LIMIT}-byte ` +
                       `issue-body limit to inline it here — read it on ` +
                       `[the page](${site}/wikidata-garborg-day.html) above.\n`;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Garborg batch ${when} UTC - ${process.env.CREATES} creations`,
              body,
              assignees: [context.repo.owner],
            });
            core.info(`opened #${issue.data.number}: ${issue.data.html_url}`);

  # **The third deliverable, from the same dispatch.** The design is one run producing the
  # archive, the site and the QuickStatements -- the archive is already inside `--compose`
  # (STEP 0b runs `full_entities` over the ledger), the QuickStatements are the job above, and
  # this is the site.
  #
  # `needs: pipeline` rather than `needs: gate`, deliberately: if the account has not edited, the gate
  # skips the pipeline and the site is not rebuilt either. Nothing has changed, so there is
  # nothing to publish, and a run that publishes an identical page is the kind of noise the
  # gate exists to prevent.
  #
  # A called workflow does not inherit job-level permissions, so Pages needs its own here.
  site:
    needs: pipeline
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    # `needs:` orders the jobs; it does NOT move github.sha, which stays the commit that
    # triggered the run. Passing the pushed sha explicitly is what makes the published page
    # carry the batch this run just built rather than the previous one's.
    with:
      ref: ${{ needs.pipeline.outputs.sha }}

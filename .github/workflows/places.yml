name: Places to Wikidata items

# ⛔ ITS OWN WORKFLOW, NOT A PIPELINE STEP. It ran inside pipeline.yml on 2026-09-26 with a 25-minute
# cap, used all of it, and pushed that run past the job's 150-minute limit: run 36278861460 was
# killed before it committed a batch. Resolving places is slow (a few Wikidata calls per place) and
# nothing waits on it, so it grows `reports/place-qids.tsv` here, daily, on its own clock.
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "new place strings to resolve this run"
        default: "80"

concurrency:
  group: places
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /scripts
            /reports/derived-places.csv
            /reports/garborg-qids.tsv
            /reports/place-qids.tsv
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The resolver saves after every place, so a run cut short by the step cap keeps its work.
      - name: Resolve places
        timeout-minutes: 75
        continue-on-error: true
        env:
          BOT_CONTACT: emma@topazcomputing.com
        run: python scripts/resolve-places.py --budget "${{ inputs.budget || '80' }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse reports/place-qids.tsv
          if git diff --cached --quiet; then
            echo "no new places; nothing to commit"
            exit 0
          fi
          git commit -m "places: resolve more place strings to Wikidata items"
          # The pipeline pushes on its own schedule, so losing this race is ordinary.
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main \
              && { echo "pushed on attempt $i"; exit 0; }
            echo "attempt $i lost the race; retrying"
            sleep 10
          done
          echo "could not push after five attempts" >&2
          exit 1

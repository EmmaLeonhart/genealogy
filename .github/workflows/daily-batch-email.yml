name: Daily batch

# **Emma, 2026-08-31:** *"not wikidata editing but instead emailing me the daily quickstatements
# file to me every day so I can run it."* Nothing here edits Wikidata. The deliverable is delivery.
#
# **It opens an ISSUE rather than sending mail, and that is her idea, 2026-09-01:** *"Uhh I don't
# think I need this? Can't github actions just send me an email lol."* She is right. GitHub
# already emails about issues, so an SMTP server, a sending account and an app password were three
# secrets bought for something the platform does for free. `send_batch_email.py` and the `SMTP_*`
# secrets are deleted.
#
# **The batch goes in the issue BODY, not just as a link.** QuickStatements is pasted into a
# textarea, so the text IS the deliverable and an email carrying it is a complete hand-off. The
# run artifact stays for anything that wants the file.
#
# **It is assigned to her**, because a notification on issue creation is not guaranteed by
# watching alone -- assignment is.

on:
  schedule:
    # 06:05 UTC, after the CI run at 05:17 so the two do not queue against each other.
    - cron: "5 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only the batch and the carry-forward. This workflow rebuilds nothing: the batch is
      # committed, and rebuilding needs the corpus and 17 GB.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /reports/wikidata-garborg-day.qs
            /reports/garborg-carry-forward.tsv
          sparse-checkout-cone-mode: false

      - name: What is in today's batch
        id: batch
        run: |
          FILE=reports/wikidata-garborg-day.qs
          if [ ! -s "$FILE" ]; then echo "no batch file on disk" >&2; exit 1; fi
          echo "creates=$(grep -c '^CREATE' "$FILE" || true)" >> "$GITHUB_OUTPUT"
          echo "lines=$(grep -cve '^[[:space:]]*#' -e '^[[:space:]]*$' "$FILE" || true)" >> "$GITHUB_OUTPUT"
          echo "bytes=$(wc -c < "$FILE")" >> "$GITHUB_OUTPUT"
          echo "carried=$(( $(wc -l < reports/garborg-carry-forward.tsv) - 1 ))" >> "$GITHUB_OUTPUT"

      # The file, for anything that wants a file rather than text.
      - uses: actions/upload-artifact@v4
        with:
          name: wikidata-garborg-day
          path: reports/wikidata-garborg-day.qs
          retention-days: 30

      - name: Open the issue
        uses: actions/github-script@v7
        env:
          CREATES: ${{ steps.batch.outputs.creates }}
          LINES: ${{ steps.batch.outputs.lines }}
          CARRIED: ${{ steps.batch.outputs.carried }}
          BYTES: ${{ steps.batch.outputs.bytes }}
        with:
          script: |
            const fs = require('fs');
            const LIMIT = 65536;
            const batch = fs.readFileSync('reports/wikidata-garborg-day.qs', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const head = [
              `**${process.env.CREATES} creations - ${process.env.LINES} statement lines - ` +
              `${process.env.CARRIED} carried forward**`,
              '',
              "Name items come first, then the day's people, so it runs top to bottom as one paste.",
              '',
            ].join('\n');
            // The body carries the batch when it fits. It was 54,184 bytes on 2026-09-01 against
            // a 65,536 limit -- 17% headroom -- so the fallback is not theoretical.
            const wrapped = head + '```\n' + batch + '\n```\n';
            const body = wrapped.length <= LIMIT
              ? wrapped
              : head + `The batch is ${process.env.BYTES} bytes, past the ${LIMIT}-byte issue-body ` +
                       `limit, so it is on [the run](${run}) as the \`wikidata-garborg-day\` ` +
                       `artifact instead.\n`;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Garborg batch ${today} - ${process.env.CREATES} creations`,
              body,
              assignees: [context.repo.owner],
            });
            core.info(`opened #${issue.data.number}: ${issue.data.html_url}`);

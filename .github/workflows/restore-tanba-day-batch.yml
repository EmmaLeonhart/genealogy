name: Restore Tanba-stripped day batch

# One-shot: un-corrupt reports/wikidata-garborg-day.txt on this branch.
# Triggered only when this workflow file is pushed (not on day-file commits).
on:
  push:
    paths:
      - ".github/workflows/restore-tanba-day-batch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-tanba-day-batch
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tanba-out-of-day-batch
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reports/wikidata-garborg-day.txt
            reports/tanba-qids.json
            reports/tanba-p2600-pairs.tsv
            reports/_mcp_size_probe.txt
            scripts/strip_tanba_from_day_batch.py
            scripts/tanba_batch_block.py
            .github/workflows/restore-tanba-day-batch.yml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore from main then strip Tanba
        run: |
          set -euo pipefail
          curl -fsSL -o reports/wikidata-garborg-day.txt \
            "https://raw.githubusercontent.com/EmmaLeonhart/genealogy/main/reports/wikidata-garborg-day.txt"
          before=$(wc -c < reports/wikidata-garborg-day.txt)
          echo "before_strip_bytes=$before"
          test "$before" -gt 900000
          python scripts/strip_tanba_from_day_batch.py
          after=$(wc -c < reports/wikidata-garborg-day.txt)
          echo "after_strip_bytes=$after"
          test "$after" -gt 900000
          if grep -qi tanba reports/wikidata-garborg-day.txt; then
            echo "ERROR: tanba still present after strip" >&2
            exit 1
          fi
          head -1 reports/wikidata-garborg-day.txt | grep -qv PLACEHOLDER
          head -1 reports/wikidata-garborg-day.txt

      - name: Commit restored day file; remove size probe
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/wikidata-garborg-day.txt
          git rm -f --ignore-unmatch reports/_mcp_size_probe.txt
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          Restore Tanba-stripped day QuickStatements batch

          Un-corrupt placeholder/path-literal day file on fix/tanba-out-of-day-batch
          by restoring main's day batch and running scripts/strip_tanba_from_day_batch.py.
          EOF
          )"
          git push origin HEAD:fix/tanba-out-of-day-batch

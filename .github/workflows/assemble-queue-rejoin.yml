name: Assemble re-joined queue.md

# One-shot sparse: concatenate MCP-sized queue parts, then self-delete.
# Retrigger v3: rebase before push (prior runs lost tip races).
on:
  push:
    paths:
      - ".github/workflows/assemble-queue-rejoin.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-queue-rejoin
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            queue.md
            docs/queue-archive/_queue_part_0.md
            docs/queue-archive/_queue_part_1.md
            docs/queue-archive/_queue_part_2.md
            docs/queue-archive/_queue_part_3.md
            .github/workflows/assemble-queue-rejoin.yml
          sparse-checkout-cone-mode: false
      - name: Concatenate parts into queue.md; clean up
        run: |
          set -euo pipefail
          cat docs/queue-archive/_queue_part_0.md \
              docs/queue-archive/_queue_part_1.md \
              docs/queue-archive/_queue_part_2.md \
              docs/queue-archive/_queue_part_3.md \
            > queue.md
          test -s queue.md
          grep -q 'THE META QUEUE' queue.md
          grep -q 'Fix zipper merge stuff' queue.md
          grep -q 'FS ids on entry points' queue.md
          grep -q 'INVESTIGATE ON FAMILYSEARCH' queue.md
          wc -c queue.md
          rm -f docs/queue-archive/_queue_part_0.md \
                docs/queue-archive/_queue_part_1.md \
                docs/queue-archive/_queue_part_2.md \
                docs/queue-archive/_queue_part_3.md \
                .github/workflows/assemble-queue-rejoin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue.md docs/queue-archive/ .github/workflows/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          Re-join META QUEUE / non-Geni live plan into queue.md

          Geni campaign dump stays archived; FS entry-point note kept;
          zipper section retained pending composed-batch confirmation.
          EOF
          )"
          git pull --rebase origin main
          git push origin HEAD:main

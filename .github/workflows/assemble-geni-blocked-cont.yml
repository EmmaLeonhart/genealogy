name: Assemble geni-blocked campaigns cont archive

# One-shot: concatenate MCP-sized parts into the archive file, then self-delete.
# Retrigger: parts 0-2 are staged on main.
on:
  push:
    paths:
      - ".github/workflows/assemble-geni-blocked-cont.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-geni-blocked-cont
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            docs/queue-archive/_cont_part_0.md
            docs/queue-archive/_cont_part_1.md
            docs/queue-archive/_cont_part_2.md
            docs/queue-archive/geni-blocked-campaigns-2026-09-cont.md
            .github/workflows/assemble-geni-blocked-cont.yml
          sparse-checkout-cone-mode: false
      - name: Concatenate parts into archive; clean up
        run: |
          set -euo pipefail
          mkdir -p docs/queue-archive
          cat docs/queue-archive/_cont_part_0.md \
              docs/queue-archive/_cont_part_1.md \
              docs/queue-archive/_cont_part_2.md \
            > docs/queue-archive/geni-blocked-campaigns-2026-09-cont.md
          test -s docs/queue-archive/geni-blocked-campaigns-2026-09-cont.md
          head -1 docs/queue-archive/geni-blocked-campaigns-2026-09-cont.md | grep -q 'archive part 2'
          rm -f docs/queue-archive/_cont_part_0.md \
                docs/queue-archive/_cont_part_1.md \
                docs/queue-archive/_cont_part_2.md \
                .github/workflows/assemble-geni-blocked-cont.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/queue-archive/ .github/workflows/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          Archive Geni-blocked campaigns part 2 (continuation)

          Assembled from MCP-sized parts; Geni campaign dump stays out of queue.md.
          EOF
          )"
          git push origin HEAD:main

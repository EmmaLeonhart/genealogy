# Publish the documentation site to GitHub Pages.
#
# Emma, 2026-09-01: "a github pages site built with actions that documents generally what the
# repo is doing with different things, its data modeling and algorithms and such."
#
# **No `push:` trigger**, for the same reason `ci.yml` has none: this repo commits large
# generated files many times a day, so a run per push queues behind itself and tells nobody
# anything. `tests/test_repo_invariants.py::test_no_workflow_runs_automatically` enforces that,
# and it checks every workflow rather than just CI.
#
# **The checkout must be sparse or it does not fit.** The tracked tree is ~13 GB against roughly
# 14 GB of runner disk. This job reads only CLAUDE.md, the scripts, and a handful of reports, so
# it takes far less than CI does -- but it still needs `exports/` because the page COUNTS the
# GEDCOMs, and `blob:none` keeps that cheap by fetching no blob it does not open.
name: Pages

on:
  workflow_dispatch:
  # **Callable, so ONE dispatch of the pipeline produces all three.** Emma, 2026-09-01:
  # *"the ci/cd run will make the archive (committed) and the pages and the
  # quickstatements for me to run later"* -- "the ci/cd run", singular.
  #
  # **`ref` EXISTS BECAUSE `needs:` DOES NOT MOVE THE SHA.** A reusable workflow called with
  # `uses:` runs at the CALLER's `github.sha`, and `actions/checkout` with no `ref` takes that
  # sha -- so ordering this after the pipeline job sequenced it but published the tree as it
  # stood BEFORE the rebuild. The pipeline commits and pushes a new commit; without this input
  # the site was built from its parent.
  #
  # Measured on run 33687514166 (2026-09-02): the `pipeline` job pushed 4111f4d at 22:02:19 and
  # `site / build` checked out 8dcf42f6 thirteen seconds later. Since the page publishes
  # `reports/wikidata-garborg-day.txt`, every site build served the PREVIOUS day's batch. The
  # comment that used to sit here claimed the opposite, which is why it went unnoticed.
  workflow_call:
    inputs:
      ref:
        description: "Commit to build from. Empty falls back to the sha that triggered the run."
        type: string
        required: false
        default: ""
  schedule:
    # 06:23 UTC daily. Off the hour on purpose: :00 is when every scheduled workflow on GitHub
    # fires at once and the queue is worst.
    - cron: "23 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A second run started while the first is deploying would race it, and
# `cancel-in-progress: false` means the newer one waits rather than the older one dying half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `inputs` is null on the schedule, so this falls back to github.sha there.
          ref: ${{ inputs.ref || github.sha }}
          filter: blob:none
          # The site is one file now, so the checkout is two paths plus the builder.
          # It used to pull CLAUDE.md, src/, all of reports/, paths/ and exports/ because the
          # page counted GEDCOMs and republished rules; none of that is on the page any more.
          sparse-checkout: |
            /scripts
            /reports/wikidata-garborg-day.txt
            /out/parent-review.html
            /out/patronymic-identifications.html
            /out/duplicate-surnames.html
            /out/duplicate-name-items-we-made.html
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The four big derived CSVs are committed gzipped -- GitHub refuses them at their real
      # size. `--unpack` restores the plain files the generator reads. It is not fatal if this
      # fails: `count_lines` falls back to reading the `.gz` directly, and the page then shows
      # the same numbers.
      - name: Unpack the derived tables
        run: python scripts/pack-derived.py --unpack || echo "unpack skipped; the .gz fallback covers it"

      - name: Build the site
        run: PYTHONPATH=src python scripts/build-pages-site.py

      # Fail loudly rather than publishing an empty page. A site that builds to nothing looks
      # like a working deploy, which is the failure mode this repo keeps hitting in other places.
      - name: Check the page is not empty
        run: |
          test -s out/site/index.html
          # The page IS the batch, so this is the thing to assert -- the old check looked for
          # a heading from the landing page that no longer exists.
          grep -q "CREATE" out/site/index.html
          wc -c out/site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

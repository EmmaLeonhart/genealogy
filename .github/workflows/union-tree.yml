name: Measure the Wikidata union tree on a runner

# **THE MEASUREMENT, AND ONLY THE MEASUREMENT.** `CLAUDE.md` § *The Wikidata tree does NOT yet go
# into the synoptic tree*: the overlay exists, it must not be wired into the merge until it FITS,
# and whether it fits on a runner has never been measured. This workflow answers that one question
# and changes nothing — it commits nothing and pushes nothing.
#
# **What is already known, and what is not.** The union merge ran LOCALLY on 2026-09-09:
# 3,038,219 people, 1,961,091 families, 516 MB on disk, with `--connectivity`. What is unknown is
# the runner, and the history says not to assume: the unslimmed merge was KILLED here at
# 15,921 MB with 67 MB free (run 33808839371), `--slim` then did the same tree in 8.79 GB, and
# `--connectivity` keeps the primary key, the sex and the five structural pointers only — a
# different per-person constant again, on 3.0M people instead of 1.45M.
#
# **`--connectivity` is a DIFFERENT TREE, not a smaller one.** No names, dates or places, so the
# derive scripts cannot read it. That is why this is its own workflow rather than a flag on
# `tree.yml`: the union tree answers *is this person connected*, and `out/merged.ged` feeds the
# editing pipeline. Wiring the overlay into that merge is a separate decision, and it comes after
# this number exists.
#
# The union tree is NOT committed — 516 MB, far over GitHub's file limit, exactly as
# `out/merged.ged` is not. It is uploaded as an artifact so the next step (the neighbourhood size
# measured on the merged tree rather than on the union-find stand-in) has something to read.

on:
  workflow_dispatch:
    inputs:
      merge_mode:
        description: "Which merge to measure. slim is the one that gates the wiring."
        type: choice
        options: [slim, connectivity]
        default: slim
      upload:
        description: "Upload the union tree as an artifact (~516 MB)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: union-tree
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # The same sparse checkout as `tree.yml`, and for the same reason: `out/wikidata/` STAYS IN.
      # `build-wikidata-gedcom.py` reads `relations.tsv` (77 MB) and `p2600-all.tsv` (16 MB), both
      # tracked. Disk was never the constraint here — the runner reports ~79 GB free — memory was.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/paths_for_wikidata_isolates
            !/geni-scraping
            !/geni_pages
            !/orderlife
            !/chats
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Room to work
        run: |
          echo "MEMORY"; free -m
          echo "DISK";   df -h / | tail -1
          echo "CORPUS"; find exports -name '*.ged' | wc -l
          echo "corpus bytes: $(du -sh exports | cut -f1)"

      # `build-wikidata-gedcom.py` reads `reports/derived-facts.csv` for the sex of people whose
      # own `P22`/`P25` edges do not settle it. That file is committed gzipped.
      - name: Unpack the derived CSVs
        run: python scripts/pack-derived.py --unpack || echo "nothing to unpack"

      - name: Wikidata as a mergeable GEDCOM
        id: overlay
        env:
          PYTHONPATH: src
        run: |
          ( while true; do
              echo "MEM $(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/{print "used="$3"MB avail="$7"MB"}')"
              sleep 30
            done ) &
          SAMPLER=$!
          set +e
          python scripts/build-wikidata-gedcom.py
          STATUS=$?
          set -e
          kill $SAMPLER 2>/dev/null || true
          ls -la out/wikidata-tree.ged || true
          exit $STATUS

      # **THE QUESTION.** Every `.ged` under `exports/` plus the overlay LAST, so *Later sources
      # win value conflicts* leaves Geni's own values in place on the Geni-keyed half.
      - name: The union merge
        id: union
        env:
          PYTHONPATH: src
        run: |
          ( while true; do
              echo "MEM $(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/{print "used="$3"MB avail="$7"MB"}') DISK=$(df -m / | awk 'NR==2{print $4"MB free"}')"
              sleep 30
            done ) &
          SAMPLER=$!
          set +e
          # ⛔ `--slim` IS THE ONE THAT GATES THE WIRING, and `--connectivity` never was.
          # `--connectivity` keeps the primary key, the sex and the five structural pointers and
          # drops names, dates and places -- the derive scripts cannot read that tree, so it can
          # never be `out/merged.ged`. `rebuild-everything.py` runs `--slim`, which CARRIES them,
          # peaks at 8.79 GB on this runner with the corpus alone, and was KILLED at 15,921 MB
          # before slimming existed. `--slim` plus the overlay's 1.6M more people is the number
          # that decides whether the overlay can go into the pipeline's own merge, and it is the
          # default here for that reason.
          /usr/bin/time -v python -m genimerge merge --${{ inputs.merge_mode }} \
            --also out/wikidata-tree.ged \
            -o out/union.ged 2> out/union-merge.err
          STATUS=$?
          set -e
          kill $SAMPLER 2>/dev/null || true
          echo "---- peak, off /usr/bin/time -v ----"
          grep -E "Maximum resident set size|Elapsed \(wall clock\)" out/union-merge.err || true
          tail -40 out/union-merge.err || true
          exit $STATUS

      - name: What the union tree is
        if: always()
        run: |
          if [ -f out/union.ged ]; then
            printf 'union tree: %s bytes\n' "$(wc -c < out/union.ged)"
            printf 'INDI: %s\n' "$(grep -c '^0 @I' out/union.ged || true)"
            printf 'FAM:  %s\n' "$(grep -c '^0 @F' out/union.ged || true)"
            printf 'RFN (geni-keyed):  %s\n' "$(grep -c '^1 RFN geni:' out/union.ged || true)"
            printf 'REFN (qid-only):   %s\n' "$(grep -c '^1 REFN Q' out/union.ged || true)"
          else
            echo "no union tree was produced -- read the MEM lines and union-merge.err above"
          fi

      # **THE NEIGHBOURHOOD, MEASURED ON THE MERGED TREE.** `docs/unconnected-worklist.md` § 4
      # asks for the size of the person's combined neighbourhood **in the synoptic tree**, and
      # until this step the worklist answered it with a union-find over the three tracked edge
      # sources -- right about the numbers, and it destroys the family ids, which is the one
      # thing § 1 wants the GEDCOM form for.
      #
      # It writes to a SCRATCH path, never to `reports/unconnected-p2600.tsv`. This workflow
      # commits nothing, and the committed file carries `last_attempted` for 266,201 people with
      # no second copy anywhere -- § 6, *there is no second file*. Overwriting it from a job that
      # cannot commit would strand every date.
      - name: The neighbourhood, measured on the merged tree
        if: ${{ always() && steps.union.outcome == 'success' }}
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/build-unconnected-worklist.py \
            --tree out/union.ged -o out/unconnected-p2600-from-tree.tsv
          echo "---- against the committed stand-in ----"
          echo "stand-in rows: $(( $(wc -l < reports/unconnected-p2600.tsv) - 1 ))"
          echo "tree rows:     $(( $(wc -l < out/unconnected-p2600-from-tree.tsv) - 1 ))"
          echo "---- the top of each ----"
          head -4 reports/unconnected-p2600.tsv
          echo "----"
          head -4 out/unconnected-p2600-from-tree.tsv

      # The tree itself is never committed. The artifact is so the next step -- the neighbourhood
      # measured on the merged tree instead of the union-find stand-in -- has something to read.
      - name: Keep the union tree as an artifact
        if: ${{ always() && inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: union-tree
          path: |
            out/union.ged
            out/union-merge.err
            out/unconnected-p2600-from-tree.tsv
          retention-days: 7
          if-no-files-found: warn

      - name: Say what it cost
        if: always()
        run: |
          echo "merge mode: --${{ inputs.merge_mode }}"
          echo "overlay: ${{ steps.overlay.outcome }} | union merge: ${{ steps.union.outcome }}"
          echo "REFERENCE, measured here 2026-09-09: --connectivity peaked at 9.76 GB of 16 in"
          echo "18m38s for 3,038,219 people. --slim carries names, dates and places as well, and"
          echo "is the mode that decides whether the overlay can enter the pipeline's merge."
          echo "A kill shows as 'The runner has received a shutdown signal' and nothing else;"
          echo "the MEM lines are what turn that into a number. Local reference, 2026-09-09:"
          echo "3,038,219 people, 1,961,091 families, 516 MB, with --connectivity."

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The package itself is stdlib-only; pytest is the only thing to install.
      - run: pip install pytest

      # data_lake/*.ged is committed, so the integration tests that read the
      # real exports run here too rather than skipping.
      - run: python -m pytest -q

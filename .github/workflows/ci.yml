name: CI

# MANUAL ONLY, ON PURPOSE.
#
# This is a private repo, and Actions minutes on private repos are billable
# once the monthly free allowance runs out — unlike public repos, where they
# are free. Nothing here is worth a surprise bill, so there is no `push` or
# `pull_request` trigger: this workflow runs only when somebody asks for it.
#
# The tests are fast and have no dependencies beyond pytest, so the normal way
# to run them is locally:
#
#     python -m pytest
#
# To run this on GitHub anyway (Actions > CI > Run workflow, or):
#
#     gh workflow run CI --repo <owner>/geni
#
# Re-adding a `push:` trigger means opting back into per-push billing. Don't do
# it without deciding that on purpose.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The package itself is stdlib-only; pytest is the only thing to install.
      - run: pip install pytest

      # data_lake/*.ged is committed, so the integration tests that read the
      # real exports run here too rather than skipping.
      - run: python -m pytest -q

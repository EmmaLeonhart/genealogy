name: CI

# The repo went PUBLIC on 2026-09-01 -- Emma: "The repo is public now lol" -- so Actions minutes
# are free and the old manual-only rule is retired. `CLAUDE.md` section *Cost* was written for a
# private repo and no longer binds.
#
# Still no `push:` on every commit: this repo receives large generated files many times a day
# (the 2026-09-01 label rebuild alone rewrote 3 million lines), and a run per push would queue
# behind itself for no signal. A daily schedule plus manual dispatch is the useful cadence.
on:
  workflow_dispatch:
  schedule:
    # 05:17 UTC daily. Off the hour on purpose: :00 is when every scheduled workflow on GitHub
    # fires at once and the queue is worst.
    - cron: "17 5 * * *"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      # **A plain checkout does not fit the runner.** Measured 2026-09-01: 13.3 GB tracked --
      # wikidata/ 4.3 GB, exports/ 4.3 GB, paths_for_wikidata_isolates/ 2.7 GB, reports/ 1.1 GB
      # -- against roughly 14 GB of free disk. `filter=blob:none` fetches only the blobs the
      # working tree actually needs and `sparse-checkout` narrows that to the directories a test
      # run opens.
      #
      # `exports/` IS included and is the bulk of what remains: it is the corpus, and
      # `tests/test_repo_invariants.py` compares `git ls-files 'exports/**/*.ged'` against
      # `find exports -name '*.ged'`. Excluding it would not skip that test, it would FAIL it --
      # and the failure would be an artefact of the checkout rather than of the repo.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/wikidata
            !/paths_for_wikidata_isolates
            !/geni-scraping
            !/orderlife
            !/geni_pages
            !/chats
          sparse-checkout-cone-mode: false

      - name: What did we actually check out
        run: |
          du -sh . 2>/dev/null | tail -1
          df -h / | tail -1
          echo "GEDCOMs on disk: $(find exports -name '*.ged' 2>/dev/null | wc -l)"
          echo "GEDCOMs in git:  $(git ls-files 'exports/**/*.ged' | wc -l)"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The package is stdlib-only; pytest is the only dependency.
      - run: pip install pytest

      # The four big derived CSVs are committed gzipped and every reader opens the plain file.
      # `CLAUDE.md` section *The four big derived CSVs are committed GZIPPED* -- a clean clone
      # runs this once, and CI is a clean clone every time.
      - name: Unpack the derived CSVs
        run: python scripts/pack-derived.py --unpack

      # `genimerge.wikidata.require_agent` refuses an empty User-Agent by design, because
      # Wikimedia answers one with a bare 403. One test builds a client and fails without this.
      # It is a contact address, not a secret -- it is in CLAUDE.md.
      - name: Fast lane
        env:
          BOT_CONTACT: emma@topazcomputing.com
          PYTHONPATH: src
        run: python -m pytest -m "not slow" -q --durations=15

  # The slow lane is a separate job so a red fast lane is legible on its own. It re-merges the
  # whole 605-export corpus, which peaks near 17 GB -- above what a standard runner has -- so it
  # runs the ONE slow module a hosted runner can hold. **test_density.py and
  # test_paths.py were removed 2026-09-01, her call, and the number is why:
  # a hosted runner has 16 GB and test_density pins it at 15.9 GB with 33 MB
  # free for ten minutes before the runner is reclaimed. Four jobs died that
  # way. Both modules PASS on Emma's machine in 35m44 because it has 31 GB --
  # the tests are fine and the environment is half the size they need.
  #
  # A 64 GB runner is billable even on a public repo, and rewriting
  # test_density to stream would be rewriting a test rather than the code it
  # guards. So they run locally: `pytest -m slow tests/test_density.py
  # tests/test_paths.py`, 23 passed in 35m44 on 2026-09-01.
  # first run hit the 120-minute wall at 98% with everything in one job and no
  # per-test timing to show for it -- CLAUDE.md's chunk-by-cost rule applied, so a
  # module that stalls now fails alone and --durations=0 gets a chance to print.
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: test
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        module:
          - tests/test_gedcom_real_exports.py
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/wikidata
            !/paths_for_wikidata_isolates
            !/geni-scraping
            !/orderlife
            !/geni_pages
            !/chats
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python scripts/pack-derived.py --unpack
      # **A measurement, not a fix.** Four kills across two attempts, both modules, always
      # `The runner has received a shutdown signal` with exit 143 -- at 25 to 91 minutes, well
      # inside the 180-minute timeout, with no newer run to cancel them and no `push:` trigger,
      # and both modules passing locally (23 in 35m44). Memory is SUSPECTED and not established,
      # and `CLAUDE.md` says what is not understood gets measured rather than worked around.
      #
      # `/usr/bin/time -v` reports Maximum resident set size for the pytest process, and the
      # sampler prints free memory every 30s so a climb toward the wall is visible even if the
      # runner dies before `time` can report. If memory is not the wall, this shows that too.
      - name: Memory before
        run: free -m; df -h / | tail -1; nproc

      - name: ${{ matrix.module }}
        env:
          BOT_CONTACT: emma@topazcomputing.com
          PYTHONPATH: src
        run: |
          ( while true; do
              echo "MEM $(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/{print "used="$3"MB avail="$7"MB"}')"
              sleep 30
            done ) &
          SAMPLER=$!
          set +e
          /usr/bin/time -v python -m pytest -m slow -q --durations=0 ${{ matrix.module }}
          STATUS=$?
          set -e
          kill $SAMPLER 2>/dev/null || true
          exit $STATUS

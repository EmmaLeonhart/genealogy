name: Rebuild the synoptic tree

# **The tree is built with Actions, committed and pushed to `main`.**
#
# **This is the thing that was never actually attempted.** `CLAUDE.md` said for weeks that the
# merge could not run on a runner -- 409 MB output, a peak near 17 GB, against a 16 GB runner --
# and that claim came from a measurement taken on HER machine on 2026-08-27 at 546 exports. Nobody
# ever ran it here. What shipped instead was `filter: blob:none` plus a sparse checkout, which
# scopes the CHECKOUT and shrinks the repo by not one byte, and `out/family-structure.tsv`, an
# extract committed so the daily pipeline could avoid the tree entirely. Both are workarounds
# around a limit that was never tested.
#
# **It was tried, it was killed, and one rule fixed it.** Run 33808839371 died at 15,921 MB with
# 67 MB free after seven minutes pinned at the ceiling. The rule: anything that does not go into
# the editing pipeline is not needed in the synoptic tree. `genimerge.slim` is that rule,
# and it is the whole difference: 8.79 GB and 7.7 minutes, same tree.
#
# So a local machine is no longer required for anything but Geni, and the five derived tables
# stop being a photograph dated whenever somebody last rebuilt locally.
#
# **It rebuilds everything downstream, not just the merge.** `rebuild-everything.py` runs eight
# steps whose order matters and fails silently when wrong; running the merge alone would leave
# `derived-labels.csv` a generation stale, which is a defect this repo has already paid for.

on:
  workflow_dispatch:
    inputs:
      skip_merge:
        description: "Reuse an existing out/merged.ged and rebuild only the derived layer"
        type: boolean
        default: false
  # A new export is exactly when the tree is stale, and nothing else makes it stale. Scoped to
  # `exports/**` so the many other commits a day do not queue 20-minute rebuilds behind each other.
  push:
    branches: [main]
    paths:
      - "exports/**"

permissions:
  contents: write

# One rebuild at a time, and never cancel one mid-push: a half-written derived layer is worse
# than a stale one, which is the failure `rebuild-everything.py`'s docstring is written against.
concurrency:
  group: tree
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # **`wikidata/` STAYS IN, and the first run proved why.** It was excluded here on a
      # wrong number -- "would not fit on ~14 GB of runner disk" -- and the runner's own log
      # reads `DISK=79372MB free` on every sample. Disk was never the constraint; memory was.
      # Step 3, display names, then died with
      # `no store index at out/wikidata/store-index.sqlite3`, because it reads the store to
      # label the 43,680 of our people who carry an item, and five later steps do the same.
      #
      # The 2,427 shards are tracked (4.3 GB); the index is derived and gitignored, so it is
      # rebuilt below rather than committed. `paths_for_wikidata_isolates/` and the rest are
      # genuinely unread here and stay out.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/paths_for_wikidata_isolates
            !/geni-scraping
            !/geni_pages
            !/orderlife
            !/chats
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Room to work
        run: |
          echo "MEMORY"; free -m
          echo "DISK";   df -h / | tail -1
          echo "CORPUS"; find exports -name '*.ged' | wc -l
          echo "corpus bytes: $(du -sh exports | cut -f1)"

      - name: Unpack the derived CSVs
        run: python scripts/pack-derived.py --unpack || echo "nothing to unpack; a full rebuild writes them"

      # One streaming pass over the shards -> a sqlite index of QID -> shard and Geni ID -> QID.
      # Offline; it talks to nothing. Measured here on 2026-09-03: **23 minutes, 142 MB, 2,426,152
      # items over 2,427 shards**, of which 516,595 carry a P2600. It is not committed because
      # the shards are the truth and a tracked index would be a second copy that can disagree --
      # `genimerge wikidata-index`'s own docstring says so, and it is over GitHub's file limit
      # besides.
      - name: Index the Wikidata store
        env:
          PYTHONPATH: src
        run: python -m genimerge wikidata-index

      # **Sampled every 30s so a kill is diagnosable.** A runner that runs out of memory reports
      # `The runner has received a shutdown signal` and nothing else; the sampler is what turns
      # that into a number. `rebuild-everything.py` stops at the first failing step by design.
      - name: Rebuild
        id: rebuild
        env:
          BOT_CONTACT: emma@topazcomputing.com
          PYTHONPATH: src
        run: |
          ( while true; do
              echo "MEM $(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/{print "used="$3"MB avail="$7"MB"}') DISK=$(df -m / | awk 'NR==2{print $4"MB free"}')"
              sleep 30
            done ) &
          SAMPLER=$!
          set +e
          # **`--slim` is why this can run here at all.** Without it the merge peaks at
          # 13.30 GB locally and was KILLED on this runner at 15,921 MB with 67 MB free
          # (run 33808839371). With it: 8.79 GB in 7.7 min, for the same 1,451,993 people
          # and 630,053 families, verified identical on INDI/FAM/CHIL/FAMC/NAME counts.
          if [ "${{ inputs.skip_merge }}" = "true" ]; then
            python scripts/rebuild-everything.py --skip-merge
          else
            python scripts/rebuild-everything.py --slim
          fi
          STATUS=$?
          set -e
          kill $SAMPLER 2>/dev/null || true
          echo "peak-rss-note: see the MEM lines above for the high-water mark"
          exit $STATUS

      - name: What the rebuild produced
        run: |
          ls -la out/merged.ged 2>/dev/null || echo "no merged.ged"
          for f in reports/display-names.csv reports/derived-labels.csv \
                   reports/derived-family.csv reports/derived-facts.csv \
                   out/family-structure.tsv; do
            [ -f "$f" ] && printf '%-40s %s\n' "$f" "$(wc -c < "$f")"
          done

      # **The unconnected-`P2600` worklist, AFTER the tree build.** `docs/unconnected-worklist.md`
      # § 6: the QID and the Geni id are fixed, the neighbourhood size and the membership are
      # recalculated, and `last_attempted` is read from **the previous version of this same file**
      # — which is the copy this checkout brought, carrying every date the collector stamped since
      # the last run. ⛔ *THERE IS NO SECOND FILE*, so the step must run against the checked-out
      # file and be committed below, in the same commit as the tree it was measured on.
      #
      # It runs here rather than as a step inside `rebuild-everything.py` for one reason: that
      # script stops at the first failing step, so a failure here would abandon a merge that cost
      # twenty minutes and the commit step would never run. `continue-on-error` shows the failure
      # in red and lets the tree land; a stale worklist is recoverable and a lost rebuild is not.
      #
      # The graph is a union-find over `p2600-all.tsv`, `relations.tsv` and the freshly rebuilt
      # `derived-family.csv` — a stand-in for measuring the neighbourhood on the merged tree,
      # which waits on the Wikidata overlay being wired into the merge. The script's own docstring
      # carries that, and the membership and the component size are the same either way.
      - name: The unconnected-P2600 worklist
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          before=$(wc -l < reports/unconnected-p2600.tsv 2>/dev/null || echo 0)
          python scripts/build-unconnected-worklist.py
          echo "rows before: $before  after: $(wc -l < reports/unconnected-p2600.tsv)"
          head -3 reports/unconnected-p2600.tsv

      # `pack-derived.py` gzips the four CSVs that exceed GitHub's 100 MiB limit; the plain files
      # are gitignored and the `.gz` are what is tracked. `out/merged.ged` is never committed.
      - name: Commit the rebuilt tree
        run: |
          python scripts/pack-derived.py
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed; not committing"
            exit 0
          fi
          printf '%s\n' \
            'rebuild the synoptic tree in Actions' \
            '' \
            'Full rebuild-everything.py run on a GitHub runner: the merge over every .ged' \
            'under exports/, then the derived layer in its required order, then the batch.' \
            '' \
            'This is the rebuild that used to need a local machine. out/merged.ged is not' \
            'committed -- it is 409 MB and over the file limit -- but everything derived' \
            'from it is, so the daily pipeline now reads a tree this run built rather than' \
            'a photograph taken locally.' \
            '' \
            'reports/unconnected-p2600.tsv is regenerated in the same commit: membership and' \
            'neighbourhood size recalculated against this tree, last_attempted carried forward' \
            'from the version this run checked out.' \
            > /tmp/msg.txt
          git commit -F /tmp/msg.txt

          # ⛔ THE REBUILD COLLIDES WITH ITS OWN OUTPUT, AND A BARE `git pull --rebase` THREW AWAY
          # AN ENTIRE 90-MINUTE RUN. Run 34571724211 finished all 17 steps and then died here with
          # conflicts in reports/garborg-live-items.json, garborg-live-labels.tsv,
          # garborg-live-values.tsv, garborg-qids.tsv, label-edits-emitted.tsv,
          # name-tokens-needed.tsv, wikidata-garborg-day.txt and wikidata-garborg-name-items.txt.
          #
          # `actions/checkout` takes the commit that TRIGGERED the run, not the tip of `main`, so
          # any push landing during the rebuild leaves this commit replaying onto a base that has
          # moved. Every conflicting path is GENERATED by construction: the commit being replayed
          # holds only what the rebuild changed, and a conflict needs both sides to have touched
          # the path.
          #
          # `pipeline.yml` has resolved this since 2026-09-06 and this workflow never did — the
          # same sibling-inconsistency that had `build-parent-candidates.py` failing where
          # `build-family-candidates.py` drops. The logic below is that one, unchanged.
          #
          # The newest rebuild is the right one: it ran the ledger refresh last. During a rebase
          # git replays OUR commit onto upstream, so the version to keep is the confusingly-named
          # `--theirs`.
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              unmerged="$(git diff --name-only --diff-filter=U)"
              if [ -z "$unmerged" ]; then
                echo "::error::rebase stopped with no conflicted paths -- not guessing"
                git rebase --abort || true
                exit 1
              fi
              echo "resolving in favour of this run's rebuild:"
              printf '%s\n' "$unmerged"
              # `git checkout --theirs` writes the WORKING TREE and leaves the index unmerged, so
              # the `git add -A` below is what actually resolves it -- and it stages a
              # delete/modify conflict correctly, since the file is simply absent. Reversing these
              # two lines deletes every conflicted file instead of keeping it.
              git checkout --theirs -- . 2>/dev/null || true
              git add -A
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "::error::paths still unmerged after resolution"
                git rebase --abort || true
                exit 1
              fi
              # Committing a conflict marker is worse than the failure this replaces.
              if git grep -qI -e '^<<<<<<< ' -e '^>>>>>>> ' --cached; then
                echo "::error::conflict markers survived resolution -- refusing to push"
                git rebase --abort || true
                exit 1
              fi
              # Resolving can leave the replayed commit identical to upstream, which is not an
              # error and is not something --continue will accept.
              if git diff --cached --quiet; then
                GIT_EDITOR=true git rebase --skip || { git rebase --abort || true; exit 1; }
              else
                GIT_EDITOR=true git rebase --continue || { git rebase --abort || true; exit 1; }
              fi
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::push still rejected after 5 attempts"
              exit 1
            fi
          done

      - name: Say what it cost
        if: always()
        run: |
          echo "Rebuild step outcome: ${{ steps.rebuild.outcome }}"
          echo "If this was killed, the MEM lines in the Rebuild log give the high-water mark."
          echo "The shrinking levers, in measured order: notes+media are ~67% of corpus bytes"
          echo "(CONT 31.8%, CONC 20.7%, FILE 7.3%, NOTE 4.5%, TEXT 1.5%); names ~6%."

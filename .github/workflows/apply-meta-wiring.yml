name: Apply META wiring (pairs + queue)

# One-shot. Emma: dispatch once after it lands on main.
# Wires pipeline.yml (patronymic pairs + description audit) and drops done queue.md items.
# Uses Contents API only (no giant checkout). Self-deletes when finished.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch applicator via Contents API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import base64, json, os, urllib.request
          token = os.environ["GITHUB_TOKEN"]
          url = "https://api.github.com/repos/EmmaLeonhart/genealogy/contents/scripts/apply_meta_wiring.py?ref=main"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req) as r:
              meta = json.load(r)
          open("apply_meta_wiring.py", "w", encoding="utf-8").write(
              base64.b64decode(meta["content"]).decode()
          )
          print("fetched", meta["sha"], "bytes", meta["size"])
          PY

      - name: Apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 apply_meta_wiring.py
